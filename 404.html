<script>
  // /reservas/ → /reservas, /painel/ → /painel
  var p=location.pathname;
  if(p.length>1&&p.endsWith("/")){location.replace(p.replace(/\/+$/,"")+location.search+location.hash);}
  else if(/\/index\.html$/.test(p)){location.replace(p.replace(/\/index\.html$/,"")||"/");}
</script>
